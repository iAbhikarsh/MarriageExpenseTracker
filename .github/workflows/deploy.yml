name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.APIKEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.AUTHDOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.PROJECTID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.STORAGEBUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.MESSAGINGSENDERID }}
          FIREBASE_APP_ID: ${{ secrets.APPID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };
          const missing = Object.entries(config).filter(([, value]) => !value);
          if (missing.length) {
            console.error(`Missing repository secrets: ${missing.map(([key]) => key).join(', ')}`);
            process.exit(1);
          }
          fs.writeFileSync(
            'firebase-config.js',
            `window.MARRIAGE_FIREBASE_CONFIG = ${JSON.stringify(config)};\nfirebase.initializeApp(window.MARRIAGE_FIREBASE_CONFIG);\n`
          );
          NODE
          mkdir _site
          cp index.html script.js style.css firebase-config.js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4